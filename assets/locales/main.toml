vi = "Trò chơi bị thoát trong vòng vài giây và bản ghi lỗi driver được tìm thấy. Điều này thường xảy ra khi kết nối tới máy chủ Genshin Impact bị quá hạn.\n\nCác bản Wine mới nhất dựa trên Spritz có thể khắc phục lỗi này bằng cách sử dụng WINE_ENABLE_TIMEOUT_FIX=1. Bạn có muốn bật nó không?\n\nBạn cũng có thể thay đổi cài đặt này ở Cài đặt -> Cải tiến -> Wine."
