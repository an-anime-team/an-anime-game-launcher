[timeout-fix-detected-description]
cs = "The game exited within a few seconds and a driver error log was found. This usually means the connection to Genshin Impact's servers timed out.\n\nLatest Spritz-based Wine runners can work around this via WINE_ENABLE_TIMEOUT_FIX=1. Do you want to enable it?\n\nYou can also toggle this in Preferences -> Enhancements -> Wine."
de = "The game exited within a few seconds and a driver error log was found. This usually means the connection to Genshin Impact's servers timed out.\n\nLatest Spritz-based Wine runners can work around this via WINE_ENABLE_TIMEOUT_FIX=1. Do you want to enable it?\n\nYou can also toggle this in Preferences -> Enhancements -> Wine."
en = "The game exited within a few seconds and a driver error log was found. This usually means the connection to Genshin Impact's servers timed out.\n\nLatest Spritz-based Wine runners can work around this via WINE_ENABLE_TIMEOUT_FIX=1. Do you want to enable it?\n\nYou can also toggle this in Preferences -> Enhancements -> Wine."
es = "The game exited within a few seconds and a driver error log was found. This usually means the connection to Genshin Impact's servers timed out.\n\nLatest Spritz-based Wine runners can work around this via WINE_ENABLE_TIMEOUT_FIX=1. Do you want to enable it?\n\nYou can also toggle this in Preferences -> Enhancements -> Wine."
fr = "Le jeu s'est fermé dans l'espace de quelques secondes, avec une erreur de pilote. Cela veut en général dire que la connexion aux serveurs de Genshin Impact a expiré.\n\nLes derniers runners Wine Spritz peuvent contourner ce problème via WINE_ENABLE_TIMEOUT_FIX=1. Voulez-vous l'activer?\n\nVous pouvez aussi changer ceci dans Préférences -> Améliorations -> Wine."
hu = "The game exited within a few seconds and a driver error log was found. This usually means the connection to Genshin Impact's servers timed out.\n\nLatest Spritz-based Wine runners can work around this via WINE_ENABLE_TIMEOUT_FIX=1. Do you want to enable it?\n\nYou can also toggle this in Preferences -> Enhancements -> Wine."
id = "The game exited within a few seconds and a driver error log was found. This usually means the connection to Genshin Impact's servers timed out.\n\nLatest Spritz-based Wine runners can work around this via WINE_ENABLE_TIMEOUT_FIX=1. Do you want to enable it?\n\nYou can also toggle this in Preferences -> Enhancements -> Wine."
it = "The game exited within a few seconds and a driver error log was found. This usually means the connection to Genshin Impact's servers timed out.\n\nLatest Spritz-based Wine runners can work around this via WINE_ENABLE_TIMEOUT_FIX=1. Do you want to enable it?\n\nYou can also toggle this in Preferences -> Enhancements -> Wine."
ja = "ゲームがすぐに終了し、ドライバエラーが記録されたことを確認しました。 これは通常、原神のサーバーとの接続がタイムアウトしたことを意味します。\n\n最新バージョンのSpritzベースのWineでは、WINE_ENABLE_TIMEOUT_FIX=1を設定することによりこれを回避できます。 有効にしますか？\n\nこの設定は、設定 -> 上級者向け -> Wineから変更できます。"
ko = "방금 드라이버 오류가 발견된 채 게임이 종료되었습니다. 이는 보통 원신 서버가 연결에 응답하지 않았다는 것을 의미합니다.\n\nLatest Spritz-based Wine runners can work around this via WINE_ENABLE_TIMEOUT_FIX=1. 최신 Spritz기반 Wine 실행기는 WINE_ENABLE_TIMEOUT_FIX=1로 고칠 수 있습니다. 이를 활성화 하시겠습니까?\n\n설정 -> 고급 -> Wine에서 관리하실 수 있습니다."
nl = "The game exited within a few seconds and a driver error log was found. This usually means the connection to Genshin Impact's servers timed out.\n\nLatest Spritz-based Wine runners can work around this via WINE_ENABLE_TIMEOUT_FIX=1. Do you want to enable it?\n\nYou can also toggle this in Preferences -> Enhancements -> Wine."
