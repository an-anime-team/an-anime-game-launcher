[tos-violation-warning-message]
cs = "Tento spouštěč je neoficiální nástroj, který nijak nesouvisí se společností miHoYo ani COGNOSPHERE.\n\nTento nástroj je navržen tak, aby usnadnil hraní Genshin Impact na Linuxu, a byl vytvořen s jediným účelem – nainstalovat a spustit hru s menšími problémy.\n\nČiní tak pomocí stávajících komponent a zjednodušuje práci uživatele.\n\nNěkteré zde použité komponenty však pravděpodobně porušují smluvní podmínky miHoYo pro Genshin Impact.\n\nPokud používáte tento spouštěč, váš hráčský účet může být označen jako nesplňující TOS podle miHoYo/COGNOSPHERE.\n\nPokud k tomu dojde a váš účet by porušil TOS, miHoYo/COGNOSPHERE si může dělat, co chce. Včetně zákazu.\n\nPokud chápete riziko pokusu hrát hru neoficiálně, pokračujte stisknutím OK"
de = "Dieser Launcher ist ein inoffizielles Tool, das in keiner Weise mit miHoYo oder COGNOSPHERE in Verbindung steht.\n\nDieses Tool soll das Spielen von Genshin Impact unter Linux erleichtern und wurde mit dem einzigen Ziel entwickelt, das Spiel mit weniger Aufwand zu installieren und zu betreiben.\n\nDies geschieht durch die Verwendung vorhandener Komponenten und die Vereinfachung der Erfahrung für den Benutzer.\n\nEinige der hier verwendeten Komponenten verstoßen jedoch wahrscheinlich gegen die miHoYo Nutzungsbedingungen für Genshin Impact.\n\nWenn Sie diesen Launcher verwenden, könnte Ihr Spielerkonto durch miHoYo/COGNOSPHERE als AGB-widrig identifiziert werden.\n\nSollte dies der Fall sein, steht es miHoYo/COGNOSPHERE frei, zu tun, was sie wollen, einschließlich eines Bans.\n\nWenn Sie sich über das Risiko bewusst sind, das mit dem Versuch des spielens in inoffizieller Weise verbunden ist, dann drücken Sie OK, um fortzufahren."
en = "This launcher is an unofficial tool, in no way related to miHoYo nor COGNOSPHERE.\n\nThis tool is designed to facilitate playing Genshin Impact on Linux, and was built with the sole purpose of installing and running the game with less hassle.\n\nIt does so by using existing components and making the experience simple for the user.\n\nHowever, some components used here likely break the miHoYo Terms of Service for Genshin Impact.\n\nIf you are using this launcher, your player account could become identified as TOS-non-compliant by miHoYo/COGNOSPHERE.\n\nIf this happens, as your account would be disobeying TOS, miHoYo/COGNOSPHERE are free to do what they want. Including banning.\n\nIf you understand the risk of trying to play the game in an unofficial capacity, press OK to continue"
es = "Este launcher es una herramienta no oficial, que de ninguna manera está relacionada con miHoYo ni COGNOSPHERE.\n\nEsta herramienta fue diseñada para facilitar jugar a Genshin Impact en Linux, y fue construida con el único propósito de instalar y correr el juego con menor esfuerzo.\n\nPara hacer esto, usa componentes ya existentes para facilitarle la experiencia al usuario.\n\nSin embargo, algunos de los componentes usados aquí posiblemente incumplan los Terminos y Condiciones de Uso de miHoYo para Genshin Impact.\n\nSi usas este launcher, tu cuenta podría ser identificada por miHoYo/COGNOSPHERE como una cuenta incumplidora de los Términos y Condiciones.\n\nSi esto sucede, miHoYo/COGNOSPHERE se reservan el derecho de hacer lo que quieran con tu cuenta. Esto incluye banearte del juego.\n\nSi entiendes los riesgos de intentar jugar el juego de manera extraoficial, presiona OK y ¡exploremos el vasto mundo de Teyvat!"
fr = "Ce launcher est un outil non-officiel, il n'est associé ni à miHoYo, ni à COGNOSPHERE.\n\nCet outil est conçu pour faciliter l'accès au jeu Genshin Impact sur Linux, et a été créé dans le seul but d'installer et de lancer le jeu plus facilement.\n\nL'outil utilise pour cela des composants existants pour fournir à l'utilisateur une expérience simple.\n\nCependant, certains composants utilisés ne respectent pas les Conditions Générales d'Utilisation de miHoYo pour Genshin Impact.\n\nAinsi, si vous utilisez ce launcher, votre compte joueur peut être identifié comme non conformes aux CGU par miHoYo/COGNOSPHERE.\n\nSi c'est le cas, étant donné que votre compte n'est pas conforme aux CGU, miHoYo/COGNOSPHERE se réservent le droit d'agir comme bon leur semble. Leurs actions peuvent notamment inclure le bannissement de votre compte.\n\nSi vous comprenez ces risques, appuyez sur \"Continuer\" pour venir explorer le monde de Teyvat !"
hu = "Ez a launcher egy nem hivatalos eszköz, semmi köze miHoYo és COGNOSPHERE-hez.\n\nEz az eszköz arra készült, hogy lehetővé tegye Genshin Impact használatát Linux-on, és hogy megegyszerűsítse a telepítését és futtatását.\n\nEzt már létező komponensek felhasználásával teszi, ami egyszerűbbé teszi a felhasználó élményét.\n\nViszont, pár komponens megszegheti miHoYo Felhasználási Feltételeit(TOS) Genshin Impact-hez.\n\nHa használod ezt a launchert, a fiókodat TOS-megszegőként azonosíthatja a miHoYo/COGNOSPHERE.\n\nHa ez megtörténik, mivel megszegi a fiókod a TOS-t, így miHoYo/COGNOSPHERE bármit megtehet. Beleértve bannolhat is.\n\nHa megérted a játék nem hivatalos futtatásának kockázatait, nyomd meg az OK gombot a folytatáshoz."
id = "Launcher ini tidak resmi dan tidak berhubungan dengan miHoYo ataupun COGNOSPHERE.\n\nAplikasi ini didesain untuk memfasilitasi bermain Genshin Impact di Linux dan dibuat dengan tujuan untuk memasang dan menjalankan game dengan sedikit kerepotan.\n\nHal tersebut dilakukan dengan menggunakan komponen yang sudah tersedia dan membuat pengalaman yang lebih sederhana untuk pengguna.\n\nNamun, sebagian komponen yang digunakan kemungkinan besar melanggar miHoYo Ketentuan layanan untuk Genshin Impact.\n\nJika Anda menggunakan launcher ini, akun Anda bisa jadi teridentifikasi sebagai akun yang tidak mematuhi ketentuan layanan oleh miHoYo/COGNOSPHERE\n\nJika hal ini terjadi, karena akun Anda akan melanggar ketentuan layanan, miHoYo/COGNOSPHERE berhak untuk melakukan apa saja, termasuk banning\n\nJika Anda mengerti resiko yang ada untuk memainkan game ini secara tidak resmi, tekan OK untuk lanjut"
it = "Questo launcher è uno strumento non ufficiale, non ha a che fare in alcun modo con miHoYo né con COGNOSPHERE.\n\nQuesto strumento è fatto per rendere possibile giocare a Genshin Impact su Linux ed è stato creato con il solo scopo di installare ed eseguire il gioco con meno seccature.\n\nRealizza ciò usando componenti esistenti e rendendo l'esperienza semplice per l'utente.\n\nPerò alcuni componenti usati qui probabilmente violano i Termini di Servizio di miHoYo per Genshin Impact.\n\nSe stai usando questo launcher, il tuo account potrebbe essere identificato come non conforme ai TdS da miHoYo/COGNOSPHERE.\n\nSe ciò dovesse succedere, dato che il tuo account starebbe trasgredendo i TdS, miHoYo/COGNOSPHERE sono liberi di fare quello che vogliono. Incluso il banning.\n\nSe comprendi il rischio che implica giocare al gioco in maniera inufficiale, premi OK per continuare"
ja = "このランチャーは非公式なツールです。miHoYo や COGNOSPHERE とは一切関係がございません。\n\nこのツールは Genshin Impact をLinux上でプレイするために作成されました。また、手間をかけずに Genshin Impact をLinux上にインストール、そして実行するように設計されています。\n\nこれは、既存のコンポーネントを使用し、ユーザーのインストールをシンプルにすることによって実現されます。\n\nただし、このプログラムで使う一部のコンポーネントは miHoYo や Genshin Impact の利用規約に違反している可能性があります。\n\nこのランチャーを使うにあたって、あなたのゲームアカウントは利用規約違反として、 miHoYo/COGNOSPHERE に認識される可能性があります。\n\nその場合、あなたのアカウントは利用規約に従わないため、 miHoYo/COGNOSPHERE はBANを含め、何かしらの処分を行う可能性があります。\n\nこのリスクを理解した場合、OKボタンを押して続行してください。"
ko = "이 런처는 miHoYo 또는 COGNOSPHERE과 전혀 관련이 없는 비공식 도구입니다.\n\n이 도구는 Linux에서 Genshin Impact을 쉽게 플레이할 수 있도록 설계되었으며, 번거로움을 덜고 게임을 설치 및 실행하기 위한 목적으로 제작되었습니다.\n\n이는 기존 구성 요소를 사용하고 사용자 경험을 단순화하여 구현됩니다.\n\n그러나 여기에 사용된 일부 구성 요소는 miHoYo의 Genshin Impact 서비스 약관을 위반할 수 있습니다.\n\n이 런처를 사용하는 경우, 플레이어 계정이 miHoYo/COGNOSPHERE에 의해 TOS를 준수하지 않는 것으로 식별될 수 있습니다.\n\n이 경우 계정이 TOS를 위반하는 것이므로 miHoYo/COGNOSPHERE은 원하는 대로 자유롭게 조치를 취할 수 있습니다. 물론 차단도 포함됩니다.\n\n비공식적인 자격으로 게임을 플레이하는 것에 대한 위험을 이해했다면 확인을 눌러 계속합니다."
nl = "Deze launcher is niet officiëel en heeft op geen enkele manier betrekking met miHoYo of COGNOSPHERE.\n\nDit programma is ontworpen om het spelen van Genshin Impact op Linux makkelijker te maken, en is gemaakt met als enig doel on het spel makkelijiker te installeren en spelen op Linux\n\nDit gebeurt door bestaande componenten te gebruiken en de ervaring voor de gebruiker eenvoudig te maken.\n\nSommige hier gebruikte componenten zijn echter waarschijnlijk in strijd met de servicevoorwaarden van miHoYo voor Genshin Impact.\n\nAls je deze launcher gebruikt, kan je account worden geïdentificeerd als niet-conform met de TOS door miHoYo/COGNOSPHERE wijzigen.\n\nAls dit gebeurt, is miHoYo/COGNOSPHERE vrij om te doen wat ze willen, omdat je account de Servicevoorwaarden zou schenden. Inclusief een game ban.\n\nAls je het risico snapt om het spel te spelen in een onofficiële manier, druk dan op OK om door te gaan"
pl = "Ten launcher jest narzędziem nieoficjalnym i nie ma żadnego związku z miHoYo ani COGNOSPHERE.\n\nNarzędzie to zostało zaprojektowane w celu ułatwienia grania w Genshin Impact na systemie Linux i zostało stworzone z jedynym celem instalowania i uruchamiania gry z mniejszymi kłopotami.\n\nRobi to, wykorzystując istniejące komponenty i upraszczając doświadczenie dla użytkownika.\n\nJednak niektóre zastosowane tutaj komponenty prawdopodobnie łamią Warunki Korzystania miHoYo dla Genshin Impact.\n\nJeśli korzystasz z tego uruchamiacza, twoje konto gracza może zostać uznane za niezgodne z Warunkami Korzystania miHoYo/COGNOSPHERE.\n\nJeśli do tego dojdzie, jako że twoje konto byłoby w sprzeczności z Warunkami Korzystania, miHoYo/COGNOSPHERE mają prawo zrobić to, co chcą. Włącznie z blokadą.\n\nJeśli rozumiesz ryzyko próby grania w grę w sposób nieoficjalny, naciśnij OK, aby kontynuować."
pt = "Esse launcher é uma ferramenta não oficial, de nenhuma forma relacionada à miHoYo nem COGNOSPHERE.\n\nEssa ferramenta foi feita para facilitar jogar Genshin Impact no Linux, e foi construida com o único propósito de instalar e rodar o jogo com menos complicação.\n\nFazemos isso usando componentes existentes e fazendo a experiência mais simples para o usuário.\n\nPorém, alguns componentes usados aqui provavelmente quebram os Termos de Serviço da miHoYo para Genshin Impact.\n\nSe está usando esse launcher, sua conta de jogador pode ser identificada como desconforme pela miHoYo/COGNOSPHERE.\n\nSe isso acontecer, como sua conta estaria desobedecendo os Termos de Serviço, miHoYo/COGNOSPHERE são livres para fazerem o que quiserem. Incluindo banir.\n\nSe entende o risco de tentar jogar o jogo em capacidade não oficial, aperte OK para continuar"
ru = "Этот лаунчер является неофициальным и ни в коем случае не относится к miHoYo или COGNOSPHERE.\n\nОн был разработан с целью предоставления возможности игры в Genshin Impact на Linux.\n\nЕго главная цель - помочь установить и запустить игру с меньшими хлопотами.\n\nЭто достигается за счет использования существующих компонентов и упрощения работы пользователя.\n\nОднако, некоторые компоненты, используемые здесь, вероятно нарушают пользовательское соглашение Genshin Impact, принадлежащей miHoYo.\n\nЕсли вы используете данный лаунчер - ваш игровой аккаунт может быть признан как нарушающий пользовательское соглашение miHoYo/COGNOSPHERE.\n\nЕсли это произойдёт - поскольку ваша учетная запись будет нарушать правила, miHoYo/COGNOSPHERE будут свободы делать то, что захотят, включая блокировку вашего аккаунта.\n\nЕсли вы осознаёте риск использования неофициальных средств игры - нажмите \"Продолжить\""
sv = "Den här starthanteraren är ett inofficiellt verktyg, som inte på något sätt är relaterat till antingen miHoYo eller COGNOSPHERE.\n\nDet här verktyget är designat för att tillåta att spela Genshin Impact på Linux, och byggdes med det enda syftet att kunna installera och köra spelet med mindre krångel.\n\nDet gör den genom att använda befintliga komponenter och göra upplevelsen enkel för användaren.\n\nVissa komponenter som används här kan dock bryta mot miHoYo Terms of Service för Genshin Impact.\n\nOm du använder denna starthanterare kan ditt spelarkonto identifieras som TOS-non-compliant av miHoYo/COGNOSPHERE.\n\nOm detta händer, eftersom ditt konto inte skulle lyda TOS, är miHoYo/COGNOSPHERE fria att göra vad de vill göra. Inklusive avstängning\n\nOm du förstår risken med att försöka spela spelet i en inofficiell kapacitet, tryck OK för att fortsätta"
th = "Launcher นี้เป็นเครื่องมือที่ไม่การเกี่ยวข้องแต่อย่างใดกับ miHoYo หรือ COGNOSPHERE.\n\nเครื่องมือนี้ออกแบบมาเพื่ออำนวยความสะดวกในการเล่น Genshin Impact บน Linux และสร้างขึ้นโดยมีวัตถุประสงค์เพียงอย่างเดียวในการติดตั้งและรันเกมโดยมีความยุ่งยากที่น้อยลง\n\nLauncher นี้ทำงานได้โดยใช้คอมโพเนนต์ที่มีอยู่แล้ว ผู้ใช้จึงจะได้รับประสบการณ์ที่เรียบง่าย\n\nอย่างไรก็ตาม ส่วนประกอบบางอย่างที่ใช้อาจฝ่าฝืนข้อกำหนดในการให้บริการของ miHoYo สำหรับเกม Genshin Impact\n\nหากคุณใช้ Launcher นี้ บัญชีของคุณอาจถูกระบุว่าไม่เป็นไปตามข้อกำหนดของ miHoYo/COGNOSPHERE.\n\nหากเกิดเหตุการณ์เช่นนี้ เนื่องจากบัญชีของคุณไม่ปฏิบัติตามข้อกำหนด, miHoYo/COGNOSPHERE จึงมีอิสระที่จะทำสิ่งที่พวกเขาอยาก รวมถึงการแบนบัญชีของคุณ\n\nหากคุณเข้าใจถึงความเสี่ยงในการพยายามเล่นเกมอย่างไม่เป็นทางการ ให้กด ตกลง เพื่อดำเนินการต่อ"
tr = "Bu başlatıcı, resmi olmayan bir araçtır ve hiçbir şekilde miHoYo veya COGNOSPHERE ile ilgili değildir.\n\nBu araç, Linux'ta Genshin Impact oynamayı kolaylaştırmak için tasarlanmıştır ve yalnızca oyunu daha az güçlükle yüklemek ve çalıştırmak amacıyla oluşturulmuştur.\n\nBunu, mevcut bileşenleri kullanarak ve deneyimi kullanıcı için basit hale getirerek yapar.\n\nAncak burada kullanılan bazı bileşenler, Genshin Impact için miHoYo Hizmet Şartlarını ihlal ediyor olabilir.\n\nBu başlatıcıyı kullanıyorsanız, Genshin Impact hesabınız miHoYo/COGNOSPHERE tarafından TOS uyumlu değil olarak tanımlanacaktır.\n\nBöyle bir durumda, hesabınız Hizmet Koşullarına uymayacağından, miHoYo/COGNOSPHERE istediğini yapmakta özgürdür. Banlamak dahil.\n\nEğer oyunu illegal yollarla oynamanın riskini anlıyorsanız, Tamam'a tıklayın"
uk = "Цей лаунчер є неофіційним і ніяк не відноситься до miHoYo або COGNOSPHERE.\n\nВін був розроблений з метою надання можливості грати в Genshin Impact на Linux.\n\nЙого головна мета - допомогти встановити і запустити гру з меншими клопотами.\n\nЦе досягається за рахунок використання існуючих компонентів і спрощення роботи користувача.\n\nОднак, деякі компоненти, що використовуються тут, ймовірно порушують угоду користувача Genshin Impact, що належить miHoYo.\n\nЯкщо ви використовуєте цей лаунчер - ваш геймерський аккаунт може бути визнаний як порушуючий угоду користувача miHoYo/COGNOSPHERE.\n\nЯкщо це станеться - оскільки ваш обліковий запис буде порушувати правила, miHoYo/COGNOSPHERE будуть вільні робити те, що захочуть, включаючи блокування вашого аккаунта.\n\nЯкщо ви усвідомлюєте ризик використання неофіційних засобів гри - натисніть \"Продовжити\""
vi = "Launcher này là một công cụ không chính thức, hoàn toàn không liên quan đến miHoYo hay COGNOSPHERE.\n\nCông cụ này được thiết kế để hỗ trợ việc chơi Genshin Impact trên Linux và được xây dựng với mục đích duy nhất là cài đặt và chạy trò chơi một cách dễ dàng hơn.\n\nNó làm được vậy bằng cách sử dụng các thành phần hiện có và làm cho trải nghiệm trở nên đơn giản hơn với người dùng.\n\nTuy nhiên, một số thành phần được sử dụng ở đây có khả năng vi phạm ToS của miHoYo dành cho Genshin Impact.\n\nNếu bạn đang sử dụng Launcher này, tài khoản của bạn có thể bị miHoYo/COGNOSPHERE xác định là vi phạm ToS.\n\nNếu điều này xảy ra, vì tài khoản của bạn sẽ không tuân theo ToS, nên miHoYo/COGNOSPHERE được tự do làm những gì họ muốn. Bao gồm cả việc khóa tài khoản\n\nNếu bạn hiểu những vấn đề khi thử chơi trò chơi bằng cách không chính thức, hãy nhấn OK để tiếp tục"
zh-cn = "本启动器并非官方程序，与miHoYo以及COGNOSPHERE没有任何关系。\n\n本工具设计目的是方便在 Linux 下玩Genshin Impact，其功能仅限于减少安装和运行游戏的麻烦。\n\n启动器的功能依赖于其他第三方工具。启动器只是整合这些工具以简化用户体验。\n\n其中某些第三方工具很有可能会违反miHoYo关于Genshin Impact的使用协议。\n\n如果你使用本启动器，你的游戏账号可能会被miHoYo/COGNOSPHERE认定违反协议。\n\n一旦被认定违反协议，miHoYo/COGNOSPHERE有可能对你的账号做出任何处理，包括封号。\n\n如果你了解并接受通过非官方许可方式玩这款游戏所带来的风险，请单击“确定”。让我们一直抢过提瓦特大陆吧！"
zh-tw = "本啟動器並非官方程式，與miHoYo以及COGNOSPHERE沒有任何關係。\n\n本工具設計目的是方便在 Linux 下玩Genshin Impact，其功能僅限於減少安裝和運行遊戲的麻煩。\n\n啟動器的功能依賴於其他第三方工具。啟動器只是整合這些工具以簡化用戶體驗。\n\n其中某些第三方工具很有可能會違反miHoYo關於Genshin Impact的使用協議。\n\n如果你使用本啟動器，您的遊戲帳號可能會被miHoYo/COGNOSPHERE認定違反協議。\n\n一旦被認定違反協議，miHoYo/COGNOSPHERE有可能對你的帳號做出任何處理，包括封號。\n\n如果你了解並接受通過非官方許可方式玩這款遊戲所帶來的風險，請單擊「確定」。讓我們前往提瓦特大陸吧！"

