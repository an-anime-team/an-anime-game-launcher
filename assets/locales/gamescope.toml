ko = "커서의 이동에따라 반대로 커서를 이동시켜 되돌려놓는 대신 항상 상대 마우스 모드를 사용합니다. 마우스 커서가 게임 중앙에 올바르게 배치됩니다."
nl = "Always use relative mouse mode instead of flipping dependent on cursor visibility. The mouse cursor will correctly be centered in the game"
pl = "Always use relative mouse mode instead of flipping dependent on cursor visibility. The mouse cursor will correctly be centered in the game"
pt = "Always use relative mouse mode instead of flipping dependent on cursor visibility. The mouse cursor will correctly be centered in the game"
ru = "Использовать относительный режим мыши вместо переворачивания в зависимости от видимости курсора. Курсор мыши будет правильно центрирован в игре"
sv = "Always use relative mouse mode instead of flipping dependent on cursor visibility. The mouse cursor will correctly be centered in the game"
th = "ใช้โหมดเมาส์สัมพัทธ์เสมอแทนการพลิกขึ้นอยู่กับการมองเห็นของเคอร์เซอร์ เคอร์เซอร์เมาส์จะจัดตำแหน่งอยู่ตรงกลางของเกมอย่างถูกต้อง"
