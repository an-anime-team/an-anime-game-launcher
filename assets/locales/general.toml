[ask-superuser-permissions-description]
cs = "Launcher je použije k automatické aktualizaci vašeho souboru hostitelů. V edici flatpak to není potřeba"
de = "Launcher benötigt Superuser-Zugriff, um Ihre Hosts-Datei automatisch zu aktualisieren. Dies ist in der Flatpak-Edition nicht erforderlich"
en = "Launcher will use them to automatically update your hosts file. This is not needed in flatpak edition"
es = "El launcher usará los permisos para actualizar automáticamente tu archivo hosts. Esto no es necesario en la versión de Flatpak"
fr = "Le launcher les utilisera pour automatiquement mettre à jour votre fichier d'hôtes. Inutile dans l'édition flatpak"
hu = "A Launcher autómatikusan használni fogja hogy frissítse a hosts fájlodat. A Flatpak verzióhoz nem kell"
id = "Launcher akan otomatis memperbarui file hosts Anda. Opsi ini tidak diperlukan jika Anda memakai edisi flatpak"
it = "Il launcher li userà per aggiornare automaticamente il tuo file hosts. Questo non è necessario nell'edizione flatpak"
ja = "ホストファイルを自動更新するためにこれらを利用します。Flatpak版では必要ありません。"
ko = "런처가 이를 사용하여 호스트 파일을 자동으로 업데이트합니다. Flatpak 에디션에서는 필요하지 않습니다."
nl = "Launcher zal ze gebruiken om je hosts-bestand automatisch bij te werken. Dit is niet nodig in de flatpak-editie"
pl = "Launcher będzie używał ich do automatycznego aktualizowania twojego pliku hosts. Nie jest to wymagane w edycji Flatpak."
pt = "Launcher irá usa-lo para atualizar automaticamente os arquivos. Isso não é necessário na edição flatpak"
ru = "Лаунчер будет использовать их чтобы автоматически обновлять ваш hosts файл для отключения телеметрии игры. Не требуется при использовании flatpak"
sv = "Starthanteraren kommer att använda dem för att automatiskt uppdatera din hosts-fil. Detta behövs inte i flatpak-utgåvan"
th = "Launcher จะใช้ไฟล์เหล่านี้เพื่ออัปเดตไฟล์โฮสต์ของคุณโดยอัตโนมัติ สิ่งนี้ไม่จำเป็นในรุ่น flatpak"
tr = "İstemci, hosts dosyanızı güncellemek için yönetici izni isteyecektir. Bu değişiklik flatpak sürümü için gerekli değildir."
uk = "Лаунчер буде використовувати їх, щоб автоматично оновлювати ваш файл hosts для вимкнення телеметрії гри. Не потрібно при використанні flatpak"
vi = "Launcher sẽ sử dụng chúng để tự động cập nhật tệp hosts của bạn, không cần thiết trong phiên bản Flatpak"
zh-cn = "启动器需要超级用户权限来修改 hosts 文件。Flatpak 版无需此权限"
zh-tw = "啟動器需要超級用戶權限來修改 hosts 文件。Flatpak 版無需此權限"

