[disable-mhypbase-description]
cs = "Experimentální. Pokud je povoleno, launcher deaktivuje mhypbase.dll během aplikace hlavního patche, což je v současnosti ekvivalent xlua patch. Zlepšuje výkon a snižuje využití procesoru"
de = "Experimentell. Wenn sie diese option aktivieren, wird der launcher mhypbase.dll während des patchens deaktivieren, welches mit dem xlua Patch gleichzusetzen ist. Verbessert die Leistung und reduzuert Prozessorauslastung."
en = "Experimental. If enabled, launcher will disable mhypbase.dll during the main patch applying, which is currently an equivalent to the xlua patch. Improves performance and reduces CPU usage"
es = "Experimental. Si se activa, el launcher desactivará mhypbase.dll durante la aplicación del parche principal, lo que actualmente es equivalente a usar el parche xlua. Mejora la performance y reduce el uso de CPU"
fr = "Experimental. Si activé, le launcher désactivera mhypbase.dll durant l'application du patch principal, un équivalent au patch xlua. Améliore les performances et réduit l'utilisation CPU"
hu = "Tesztelés alatt. Ha bekapcsolod, kikapcsolja a mhypbase.dll-t a patch telepítésénél, ami az xlua patch-el ér fel. Jobb teljesítmény és kisebb CPU használat"
id = "Masih dalam pengujicobaan. Jika diaktifkan, launcher akan menonaktifkan mhypbase.dll ketika menerapkan patch utama, yang saat ini sama dengan patch xlua. Menaikkan performa dan mengurangi penggunaan CPU"
it = "Sperimentale. Se abiliata, il launcher disabiliterà mhypbase.dll durante l'applicazione della patch principale, che attualmente equivalente ad applicare la patch xlua. Migliora le prestazioni e riduce l'utilizzo della CPU"
ja = "実験的です。有効にすると、ランチャーはメインパッチの適用中にmhypbase.dllを無効にします。これは現在xluaパッチと同様です。パフォーマンスを向上させ、CPUへの負担を軽減します。"
ko = "실험적 기능입니다. 활성화하면 런처가 메인 패치 적용 중에 mhypbase.dll을 비활성화하며, 이는 현재 xlua 패치와 동일한 효과를 냅니다. 성능을 향상시키고 CPU 사용량을 줄입니다."
nl = "Experimenteel. Indien ingeschakeld, zal het opstartprogramma mhypbase.dll uitschakelen tijdens het aanbrengen van de main patch, wat momenteel gelijkwaardig is aan de xlua-patch. Verbetert de prestaties en vermindert het CPU-gebruik"
pl = "Eksperymentalne. Jeśli ta opcja jest włączona, launcher wyłączy plik mhypbase.dll podczas stosowania głównej łatki, co obecnie jest równoważne z łatką xlua. Poprawia wydajność i zmniejsza użycie CPU."
pt = "Experimental. Se ativado, o launcher ira desativar mhypbase.dll durante a aplicação do patch principal, que é atualmente equivalente ao patch xlua. melhora performance e reduz uso da CPU"
ru = "Экспериментально. Когда включено, лаунчер будет отключать mhypbase.dll во время применения основного патча, что сейчас является эквивалентом патча xlua. Улучшает производительность и снижает нагрузку на процессор"
sv = "Experimentellt. Om aktiverad så kommer starthanteraren att inaktivera mhypbase.dll under applicering av huvudsaklig patch, vilket för närvarande är en motsvarighet till xlua-patchen. Förbättrar prestanda och minskar CPU-användning"
th = "การทดลอง. หากเปิดใช้งาน launcher จะปิดใช้งาน mhypbase.dll ในระหว่างการติดตั้งแพตช์หลัก ซึ่งในปัจจุบันเทียบเท่ากับแพตช์ xlua ปรับปรุงประสิทธิภาพและลดการใช้งาน CPU"
tr = "Deneysel. Etkinleştirilirse, istemci ana yamayı uygularken mhypbase.dll'yi devre dışı bırakacaktır, bu xlua yamasına eşdeğerdir. Performansı arttırır ve işlemci kullanımını azaltır."
uk = "Експериментально. Коли включено, лаунчер буде вимикати mhypbase.dll під час застосування основного патча, що зараз є еквівалентом патча xlua. Покращує продуктивність і знижує навантаження на процесор"
vi = "Thử nghiệm. Nếu bật, Launcher sẽ vô hiệu hóa mhypbase.dll khi áp dụng bản vá chính, hiện tương đương với bản vá xlua. Cải thiện hiệu năng và giảm mức sử dụng CPU"
zh-cn = "实验性功能。启用此选项后，启动器会在应用主补丁的同时禁用 mhypbase.dll。目前与 xLua 补丁效果相同，可以提升性能，降低 CPU 使用率。"
zh-tw = "實驗性功能。啟用此選項後，啟動器會在應用主補丁的同時禁用 mhypbase.dll。目前與 xLua 補丁效果相同，可以提升性能，降低 CPU 使用率。"

