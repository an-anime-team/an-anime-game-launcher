[apply-main-patch-description]
cs = "Experimentální. Vypnutím této možnosti vám umožní spustit hru bez použití patche. To nemusí fungovat nebo vyžaduje ruční úpravy souborů. Použijte, pokud víte, co děláte"
de = "Experimentell. Wenn Sie diese Option deaktivieren, können Sie das Spiel ausführen, ohne den Patch anzuwenden. Dies könnte möglicherweise nicht funktionieren oder erfordert manuelle Änderungen an den Dateien. Verwenden Sie dies nur wenn Sie wissen was Sie tun."
en = "Experimental. Disabling this allows you to run the game without applying the patch. This may not work, or require manual files modifications. Use if you know what you're doing"
es = "Experimental. Deshabilitar esta opción te permitirá correr el juego sin aplicar el parche. Esto podría no funcionar, o requerir modificaciones manuales a los archivos. Úsalo sólo si sabes lo que estás haciendo"
fr = "Expérimental. Désactiver cette option permet de lancer le jeu sans le patch. Il n'est pas garanti que cette option marche, et des modifications manuelles seront potentiellement nécessaires. À n'utiliser que si vous savez ce que vous faites"
hu = "Kísérleti opció, a kikapcsolásával futtathatod a játékot patch nélkül. Lehet hogy nem fog működni, vagy a fájlokat manuálisan kell szerkesztened, akkor kapcsold ki ha tudod mit csinálsz."
id = "Eksperimental. Menonaktifkan opsi ini akan menginzinkan Anda menjalankan game tanpa menerapkan patch. Hal ini mungkin tidak bekerja, atau membutuhkan modifikasi file secara manual. Gunakan jika Anda tahu apa yang Anda lakukan"
it = "Sperimentale. Disabilitandola ti permette di eseguite il gioco senza applicare la patch. Ciò potrebbe non funzionare o richiedere modifiche manuali ai file. Usala se sai cosa stai facendo"
ja = "実験的です。これを無効にするとパッチ無しでゲームを起動することができます。これが機能しない場合、手動でパッチを適用する必要があります。これが何を意味するのかを理解できない人は無効にするべきではないでしょう。"
ko = "실험적 기능입니다. 이 옵션을 비활성화하면 패치를 적용하지 않고 게임을 실행할 수 있습니다. 작동하지 않거나 수동으로 파일을 수정해야 할 수 있습니다. 사용법을 알고 있는 경우에만 사용하세요."
nl = "Experimenteel. Als je dit uitschakelt, kun je het spel uitvoeren zonder de patch toe te passen. Dit werkt mogelijk niet, of vereist handmatige bestandsaanpassingen. Gebruik dit als je weet wat je doet"
pl = "Eksperymentalne. Wyłączenie tej opcji pozwoli uruchomić grę bez stosowania łatki. Może to nie działać lub wymagać ręcznych modyfikacji plików. Użyj tej opcji, jeśli wiesz, co robisz."
pt = "Experimental. Desativar isso permite jogar o jogo sem aplicar o patch. Isso pode não funcionar, ou requer modificações de arquivo manuais. Use se sabe o que está fazendo"
ru = "Экспериментально. Отключение опции позволяет запускать игру без применения патча. Это может не работать или требовать ручного изменения файлов. Используйте если знаете что делаете"
sv = "Experimentellt. Om du inaktiverar detta kan du köra spelet utan att använda patchen. Detta kanske inte fungerar eller kan kräva manuella filändringar. Använd om du vet vad du gör"
th = "การทดลอง. การปิดใช้งานจะทำให้คุณสามารถรันเกมได้โดยไม่ต้องใช้แพตช์ สิ่งนี้อาจไม่ทำงานหรือต้องมีการแก้ไขไฟล์ด้วยตนเอง ใใช้เฉพาะเมื่อคุณรู้ว่าคุณกำลังทำอะไรอยู่"
tr = "Deneysel. Bunu devre dışı bırakmak oyunu, yamayı uygulamadan açmanızı sağlar. Oyun açılmayabilir, veya dosyalara elle müdahele etmeyi gerektirebilir. Ne yaptığınızı biliyorsanız kullanın."
uk = "Експериментально. Вимкнення опції дозволяє запускати гру без застосування патча. Це може не працювати або вимагати ручної зміни файлів. Використовуйте, якщо знаєте, що робите"
vi = "Thử nghiệm. Tắt tùy chọn này cho phép bạn chạy trò chơi mà không áp dụng bản vá. Có thể không hoạt động hoặc cần chỉnh sửa tệp thủ công. Chỉ sử dụng nếu bạn biết mình đang làm gì"
zh-cn = "实验性功能。禁用此选项可以允许在没有打补丁的情况下尝试运行游戏。此时游戏可能无法正常运行，或者需要手动修改文件。请确保你知道自己在做什么"
zh-tw = "實驗性功能。禁用此選項可以允許在沒有打補丁的情況下嘗試運行遊戲。此時遊戲可能無法正常運行，或者需要手動修改文件。請確保你知道自己在做什麼"

