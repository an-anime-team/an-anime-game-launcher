[game-command-description]
cs = "Příkaz určený ke spuštění hry. Zástupný symbol %command% je generován launcherem, například: gamemoderun '%command%'"
de = "Befehl zum Starten des Spiels. Der Platzhalter %command% wird automatisch vom Launcher generiert. Zum Beispiel: gamemoderun '%command%'"
en = "Command used to launch the game. Placeholder %command% is generated automatically by the launcher. For example: gamemoderun '%command%'"
es = "Comando utilizado para ejecutar el juego. El valor por defecto %command% es generado automáticamente por el launcher. Por ejemplo: gamemoderun '%command%'."
fr = "Commande utilisée pour lancer le jeu. %command% est remplacé par la commande générée automatiquement par le launcher. Vous pouvez utiliser par exemple : gamemoderun '%command%'"
hu = "A parancs amivel futtatásra kerül a játék. Példa %command%-ot generál a launcher. Pl.: gamemoderun '%command%'"
id = "Perintah yang digunakan untuk meluncurkan game. Kata pengganti %command% dibuat secara otomatis oleh launcher. Contohnya: gamemoderun '%command%'"
it = "Comando usato per lanciare il gioco. Il segnaposto %command% è generato automaticamente dal launcher. Per esempio: gamemoderun '%command%'"
ja = "ゲームを起動するコマンド。%command% はランチャーによって自動的に置き換えられます。例: gamemoderun '%command%'"
ko = "게임을 실행하는 데 사용되는 명령입니다. %command%는 런처에서 자동으로 생성된 값을 불러오도록 합니다. 에: gamemoderun '%command%'"
nl = "Commando dat gebruikt wordt om het spel te started. %command% wordt automatisch gegenereerd door de launcher. Bijvoorbeeld: gamemoderun '%command%'"
pl = "Polecenie używane do uruchamiania gry. Symbol zastępczy %command% jest generowany automatycznie przez launcher. Na przykład: gamemoderun '%command%'"
pt = "Comando usado para iniciar o jogo. %command% é gerado automaticamente pelo launcher. Por exemplo: gamemoderun '%command%'"
ru = "Команда, используемая для запуска игры. Ключ %command% генерируется лаунчером автоматически. Например: gamemoderun '%command%'"
sv = "Kommando som används för att starta spelet. Platshållaren %command% genereras automatiskt av startprogrammet. Exempelvis: gamemoderun '%command%'"
th = "คำสั่งที่ใช้ในการเปิดเกม ตัวยึดตำแหน่ง %command% ถูกสร้างขึ้นโดยอัตโนมัติโดยตัวเรียกใช้งาน ตัวอย่างเช่น: gamemoderun '%command%'"
tr = "Oyunu çalıştırmak için kullanılan komut(lar)"
uk = "Команда, яка використовується для запуску гри. Ключ %command% генерується лаунчером автоматично. Наприклад: gamemoderun '%command%'"
vi = "Lệnh được sử dụng để khởi chạy trò chơi. Biến giữ chỗ %command% được Launcher tự động tạo. Ví dụ: gamemoderun '%command%'"
zh-cn = "启动游戏的命令。点位符 %command% 由启动器自动生成。例如：gamemoderun '%command%'"
zh-tw = "啟動遊戲的指令。佔位符 %command% 由啟動器自動生成。例如：gamemoderun '%command%'"

