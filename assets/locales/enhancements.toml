cs = "Odstraní limit FPS pomocí úpravy paměti hry. Může být detekováno anti-cheatem"
de = "Aufhebung der Frames-Rendering-Beschränkung durch Modifizierung des Spielspeichers. Kann von der Anti-Cheat-Funktion erkannt werden"
