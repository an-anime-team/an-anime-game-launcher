id = "Meniadakan batas maksimum frame yang dapat dirender oleh game dengan memodifikasi memori game. Dapat terdeteksi oleh anti-cheat"
it = "Rimuovi la limitazione del rendering dei frame modificando la memoria del gioco. Può essere rilevato dall'anti-cheat"
ja = "ゲーム内のメモリを書き換えてFPSの上限を解除します。アンチチートによって検知される可能性があります。"
ko = "게임 메모리를 수정하여 프레임 렌더링 제한을 제거합니다. 안티 치트에 의해 감지 될 수 있습니다."
nl = "Haalt het FPS limit weg van het spel door het geheugen aan te passen. Kan gedetecteerd worden door ant-cheat"
pl = "Usuwa ograniczenie renderowania klatek poprzez modyfikację pamięci gry. Może być wykrywany przez system antycheatowy"
pt = "Remove a limitação de renderização de frames modificando a memória do jogo. Pode ser detectado pelo anti-cheat"
ru = "Изменить ограничение частоты кадров путём модификации памяти игры. Может быть обнаружено античитом"
sv = "Ta bort begränsningen för rendering av bildrutor genom att modifiera spelets minne. Kan upptäckas av anti-cheat"
th = "ลบข้อจำกัด FPS โดยการปรับเปลี่ยนหน่วยความจำของเกม สามารถตรวจจับได้โดยระบบการป้องกันโกงของเกม"
tr = "Oyundaki FPS limitini kaldırır, ancak anti-hile sistemleri tarafından hile olarak algılanabilir"
