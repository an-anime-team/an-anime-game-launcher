[private-directories-description]
cs = "Tyto složky budou nahrazeny prázdným virtuálním souborovým systémem (tmpfs) a jejich původní obsah nebude dostupný pro hru v sandboxu"
de = "Diese Ordner werden durch ein leeres virtuelles Dateisystem (tmpfs) ersetzt, und ihr ursprünglicher Inhalt ist für das Spiel in der Sandbox nicht verfügbar."
en = "These folders will be replaced by an empty virtual filesystem (tmpfs), and their original content will not be available to sandboxed game"
es = "Estas carpetas serán reemplazadas por un sistema de archivos virtual (tmpfs) vacío, y su contenido real no será accesible al juego aislado"
fr = "Ces dossiers vont être remplacés par un système de fichier vide (tmpfs), et leurs contenus originaux ne seront pas accessibles au jeu dans le bac à sable"
hu = "Ezek a mappák egy üres virtuális fájlrendszerrel (tmpfs) lesznek helyettesítve, a tartalmuk nem lesz elérhető a sandboxolt játéknak"
id = "Folder-folder ini akan diganti oleh filesystem virtual kosong, dan konten aslinya tidak akan tersedia pada game yang ter-sandbox"
it = "Queste cartelle verranno rimpiazzate da un filesystem virtuale vuoto (tmpfs) e il loro contenuto originale non sarà disponibile al gioco nella sandbox"
ja = "これらのディレクトリは仮想のファイルシステムに置き換えられます (tmpfs) 。もともとあったコンテンツは利用できなくなります。"
ko = "이 폴더는 빈 가상 파일 시스템(tmpfs)으로 대체되며, 샌드박스가 적용된 게임에서 원래 콘텐츠를 사용할 수 없습니다."
nl = "Deze mappen worden vervangen door een leeg virtueel bestandssysteem (tmpfs) en hun originele inhoud zal niet beschikbaar zijn voor spellen in de sandbox"
pl = "Te foldery zostaną zastąpione pustym wirtualnym systemem plików (tmpfs), a ich oryginalna zawartość nie będzie dostępna dla zasobów gry w piaskownicy"
pt = "Essas pastas serão substituidas por um sistema virtual (tmpfs), e seu conteúdo original não será disponível ao jogo"
ru = "Эти папки будут заменены пустой виртуальной файловой системой (tmpfs) и их изначальное содержимое не будет доступно игре"
sv = "Dessa mappar kommer att ersättas av ett tomt virtuellt filsystem (tmpfs), och deras ursprungliga innehåll kommer inte att vara tillgängligt för spelet i sandlådeläge"
th = "โฟลเดอร์เหล่านี้จะถูกแทนที่ด้วยระบบไฟล์เสมือนที่ว่างเปล่า (tmpfs) และไฟล์เหล่านั้นจะไม่สามารถเข้าถึงได้โดยเกมแซนด์บ็อกซ์"
tr = "Bu klasörler boş bir sanal dosya sistemiyle değiştirilecektir (tmpfs), ve orijinal içeriklerine sanallaştırılmış oyun erişemeyecektir"
uk = "Ці папки будуть замінені порожньою віртуальною файловою системою (tmpfs) і їх початковий вміст не буде доступний грі"
vi = "Các thư mục này sẽ được thay thế bằng một hệ thống tệp ảo trống (tmpfs) và nội dung ban đầu của chúng sẽ không có sẵn cho trò chơi trong Sandbox"
zh-cn = "这些目录将会被空的虚拟文件系统（tmpfs）替代，其中的原始内容不可被沙盒中的游戏访问"
zh-tw = "這些目錄將會被空的虛擬文件系統（tmpfs）替代，其中的原始內容不可被沙盒中的遊戲訪問"

